[package]
name = "ollamaview"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
readabilityrs = "0.1.3"
futures = "0.3.32"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
